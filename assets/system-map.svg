<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Vignesh Sai system map</title>
  <desc id="desc">A visual map of the engineering themes across MCP, AI runtimes, workflows, memory and testing.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#93A4B8" opacity=".25"/></pattern>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.s{font-family:Arial,Helvetica,sans-serif}</style>
  </defs>
  <rect width="1200" height="420" rx="18" fill="#F4F7F8" stroke="#17242E" stroke-width="3"/>
  <rect x="0" y="0" width="1200" height="420" fill="url(#dots)"/>
  <g stroke="#17242E" stroke-width="2" fill="none" opacity=".6">
    <path d="M600 210 L220 92 M600 210 L980 92 M600 210 L220 328 M600 210 L980 328"/>
  </g>
  <g class="s" text-anchor="middle">
    <rect x="445" y="157" width="310" height="106" rx="12" fill="#17242E"/>
    <text x="600" y="198" fill="#A7FF3F" font-size="20" font-weight="bold">VIGNESH SAI</text>
    <text x="600" y="226" fill="#F4F7F8" font-size="13">AI systems / product engineering</text>
    <rect x="72" y="42" width="296" height="98" rx="10" fill="#A7FF3F"/>
    <text x="220" y="80" fill="#17242E" font-size="18" font-weight="bold">MCP INFRASTRUCTURE</text>
    <text x="220" y="107" fill="#17242E" font-size="12">tools · providers · secure boundaries</text>
    <rect x="832" y="42" width="296" height="98" rx="10" fill="#55D6FF"/>
    <text x="980" y="80" fill="#17242E" font-size="18" font-weight="bold">AI RUNTIMES</text>
    <text x="980" y="107" fill="#17242E" font-size="12">agents · memory · orchestration</text>
    <rect x="72" y="280" width="296" height="98" rx="10" fill="#F6EBDD"/>
    <text x="220" y="318" fill="#17242E" font-size="18" font-weight="bold">WORKFLOW SYSTEMS</text>
    <text x="220" y="345" fill="#17242E" font-size="12">graphs · approvals · observability</text>
    <rect x="832" y="280" width="296" height="98" rx="10" fill="#E8ECF7"/>
    <text x="980" y="318" fill="#17242E" font-size="18" font-weight="bold">QUALITY &amp; DESIGN</text>
    <text x="980" y="345" fill="#17242E" font-size="12">visual QA · UX · reliable delivery</text>
  </g>
  <text class="m" x="38" y="402" font-size="11" fill="#566771">A PORTFOLIO OF SYSTEMS, NOT A WALL OF REPOSITORIES</text>
</svg>
