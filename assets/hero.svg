<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Vignesh Sai — AI systems, MCP infrastructure and creative tools</title>
  <desc id="desc">A dark brutalist Y2K-inspired animated developer portfolio banner.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#243449" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#A7FF3F" stop-opacity=".95"/>
      <stop offset="1" stop-color="#55D6FF" stop-opacity=".9"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .sans{font-family:Arial,Helvetica,sans-serif}
    </style>
  </defs>
  <rect width="1400" height="460" rx="18" fill="#07111D"/>
  <rect x="1" y="1" width="1398" height="458" rx="17" fill="url(#grid)" stroke="#A7FF3F" stroke-opacity=".55" stroke-width="2"/>
  <path d="M0 370 L1400 90" stroke="#55D6FF" stroke-opacity=".2" stroke-width="2"/>
  <path d="M0 420 L1400 140" stroke="#A7FF3F" stroke-opacity=".12" stroke-width="10"/>
  <g transform="translate(92 76)">
    <text class="mono" fill="#A7FF3F" font-size="17" letter-spacing="5">BUILD / BREAK / REBUILD</text>
    <text class="sans" fill="url(#glow)" font-size="104" font-weight="900" letter-spacing="-7" filter="url(#softGlow)">VIGNESH</text>
    <text class="sans" fill="#F4F8FF" font-size="104" font-weight="900" letter-spacing="-7">SAI</text>
    <rect x="4" y="222" width="396" height="4" fill="#A7FF3F">
      <animate attributeName="width" values="396;270;396" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text class="mono" y="262" fill="#B7C6D8" font-size="18" letter-spacing="2">AI SYSTEMS  ·  MCP  ·  PRODUCT ENGINEERING</text>
    <text class="mono" y="294" fill="#55D6FF" font-size="13" letter-spacing="3">HUMAN-SCALE SOFTWARE / MACHINE-SCALE CURIOSITY</text>
  </g>
  <g transform="translate(1080 88)" filter="url(#softGlow)">
    <circle cx="120" cy="120" r="90" fill="none" stroke="#A7FF3F" stroke-width="2" stroke-dasharray="4 12">
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="120" r="56" fill="none" stroke="#55D6FF" stroke-width="3" stroke-dasharray="90 15 12 25">
      <animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="9s" repeatCount="indefinite"/>
    </circle>
    <path d="M120 42 L132 108 L198 120 L132 132 L120 198 L108 132 L42 120 L108 108 Z" fill="#A7FF3F" fill-opacity=".18" stroke="#A7FF3F" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="12s" repeatCount="indefinite"/>
    </path>
    <circle cx="120" cy="120" r="13" fill="#A7FF3F">
      <animate attributeName="r" values="10;17;10" dur="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0" y="0" width="1400" height="5" fill="#A7FF3F" opacity=".75">
    <animate attributeName="y" values="0;455;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <g class="mono" font-size="12" fill="#A7FF3F">
    <text x="42" y="430">[01] PROFILE // ONLINE</text>
    <text x="1120" y="430">SYS::VIG-890</text>
  </g>
</svg>
